<section class="min-h-screen bg-white pt-32 px-6 md:px-16 pb-20">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-6xl font-black text-gray-900 mb-4">Mes Projets</h1>
    <p class="text-xl text-gray-500 mb-12">Une collection de mes défis techniques et réalisations.</p>

    <div class="flex flex-wrap gap-3 mb-12">
      @for (lang of languages; track lang) {
        <button 
          (click)="selectedLanguage.set(lang)"
          [class]="selectedLanguage() === lang ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:border-blue-400'"
          class="px-6 py-2 rounded-full border-2 font-bold transition-all">
          {{lang}}
        </button>
      }
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (project of filteredProjects(); track project.id) {
        <div (click)="selectedProject.set(project)" class="group cursor-pointer bg-white rounded-[2rem] border border-gray-100 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500">
          <div class="h-64 overflow-hidden">
            <img [src]="project.images[0]" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
          </div>
          <div class="p-8">
            <h3 class="text-2xl font-bold mb-3">{{project.title}}</h3>
            <div class="flex flex-wrap gap-2">
              @for (l of project.languages; track l) {
                <span class="text-[10px] px-2 py-1 bg-gray-100 rounded-md font-bold text-gray-500 uppercase">{{l}}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>

<app-project-modal 
  [project]="selectedProject()" 
  (close)="selectedProject.set(null)">
</app-project-modal>
