<div class="min-h-screen bg-slate-950 flex items-center justify-center px-6 relative overflow-hidden">

  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-600/20 blur-[120px] rounded-full"></div>

  <div class="w-full max-w-md z-10">
    <div class="bg-white/5 border border-white/10 backdrop-blur-xl p-8 md:p-12 rounded-[2.5rem] shadow-2xl">
      
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="text-3xl font-black text-white">Administration</h1>
        <p class="text-slate-400 mt-2 font-medium">Accès réservé à Hardy</p>
      </div>

      <form class="space-y-6">
        <div class="space-y-2">
          <label class="text-sm font-bold text-slate-300 ml-1">Identifiant</label>
          <input type="text" 
                 class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" 
                 placeholder="Ton pseudo">
        </div>

        <div class="space-y-2">
          <label class="text-sm font-bold text-slate-300 ml-1">Mot de passe</label>
          <input type="password" 
                 class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" 
                 placeholder="••••••••">
        </div>

        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all transform active:scale-95 mt-4">
          Se connecter
        </button>
      </form>

      <div class="mt-8 text-center">
        <a routerLink="/" class="text-sm text-slate-500 hover:text-white transition-colors">← Retour au site public</a>
      </div>
    </div>
  </div>
</div>
